<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAV Converter (Mono 8kHz PCM16)</title>
    <link rel="stylesheet" href="./style.css?v=20260615c" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>Audio Converter</h1>
        <p class="subtitle">Convert any audio to WAV (PCM 16-bit, Mono, 8000 Hz) directly in your browser.</p>

        <div id="dropzone" class="dropzone" aria-label="Drop audio file here">
          <span id="dropText">Drag & drop an audio file here</span>
        </div>
        <div class="picker-row">
          <label for="fileInput" class="picker-label">Or choose file:</label>
          <input id="fileInput" class="file-picker" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg,.flac" />
        </div>

        <div class="meta">
          <p id="selectedFile">No file selected</p>
          <p class="preset">Output preset: WAV / PCM s16le / Mono / 8000 Hz</p>
        </div>

        <button id="convertBtn" disabled>Convert & Download</button>

        <div class="progress-wrap" aria-live="polite">
          <progress id="progressBar" max="100" value="0"></progress>
          <span id="progressText">0%</span>
        </div>

        <p id="status" class="status">Ready.</p>
      </section>
    </main>

    <button
      id="latestDownloadBtn"
      class="latest-download"
      type="button"
      aria-label="Download the latest converted file"
      title="Download the latest converted file"
    >
      0
    </button>

    <script src="./config.js?v=20260615c"></script>
    <script src="./app.js?v=20260615c"></script>
  </body>
</html>
